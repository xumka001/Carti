<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080807"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>SEKA</title><style>*{box-sizing:border-box}body{margin:0;background:#070707;color:#f7f0df;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}.hidden{display:none!important}.wrap{max-width:1000px;margin:auto;padding:18px}.brand{text-align:center;font:700 38px Georgia;color:#e8b95e;letter-spacing:9px;margin:20px;cursor:pointer;user-select:none}.card{background:linear-gradient(145deg,#171713,#0b0b0a);border:1px solid #59421f;border-radius:18px;padding:18px;margin:12px 0}.auth{max-width:420px;margin:8vh auto}.tabs{display:flex;gap:8px}.tabs button,.btn{border:1px solid #76531f;background:#17130e;color:#fff;border-radius:11px;padding:12px 16px}.tabs .on,.gold{background:linear-gradient(#d7aa57,#80561e)!important;color:#120d05!important;font-weight:800}input,select{width:100%;background:#090909;color:#fff;border:1px solid #4b402c;border-radius:10px;padding:12px;margin:6px 0}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.top,.homeTop{display:flex;align-items:center;gap:10px}.top .bal,.homeTop .bal{margin-left:auto;color:#e8b95e}.tables{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.tableCard{border:1px solid #49371d;border-radius:15px;padding:15px;background:#111}.adminGrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.user{display:flex;justify-content:space-between;align-items:center;border-top:1px solid #333;padding:10px 0}.muted{color:#999;font-size:13px}.danger{background:#7d1c18!important}.notice{color:#e3bd70;font-size:13px}.pill{display:inline-block;border:1px solid #5e4725;border-radius:20px;padding:4px 9px;font-size:12px}.adminLink{border-color:#9b712e!important;color:#f2c66e!important;font-weight:800}@media(max-width:650px){.adminGrid,.row{grid-template-columns:1fr}.wrap{padding:10px}.brand{font-size:30px}.top,.homeTop{flex-wrap:wrap}}</style></head><body><div class="wrap"><div id="brandHome" class="brand" role="button" tabindex="0">♛ S E K A</div><section id="auth" class="auth card"><div class="tabs"><button id="loginTab" class="on">Вход</button><button id="regTab">Регистрация</button></div><div id="loginForm"><input id="loginUser" placeholder="Логин" autocomplete="username"><input id="loginPass" type="password" placeholder="Пароль" autocomplete="current-password"><button id="loginBtn" class="btn gold">Войти</button></div><div id="regForm" class="hidden"><input id="regUser" placeholder="Логин"><input id="regPass" type="password" placeholder="Пароль"><input id="regPass2" type="password" placeholder="Повторите пароль"><input id="regTg" placeholder="Telegram, например @Vasta31"><button id="regBtn" class="btn gold">Создать аккаунт</button></div><p id="authMsg" class="notice"></p></section><section id="lobby" class="hidden"><div class="homeTop card"><b id="who"></b><span class="bal">BALANȚĂ: <b id="balance">0</b> 🟠</span><button id="adminPanelBtn" class="btn adminLink hidden">АДМИН ПАНЕЛЬ</button><button id="logout" class="btn">Выйти</button></div><div class="card"><h2>Столы</h2><div id="tables" class="tables"></div></div></section><section id="admin" class="hidden"><div class="top card"><b>♛ ADMIN PANEL</b><span class="bal">SEKA Control</span><button id="adminHome" class="btn gold">На главную</button><button id="adminLogout" class="btn">Выйти</button></div><div class="adminGrid"><div class="card"><h2>Создать стол</h2><input id="tName" placeholder="Название стола" value="Royal 1"><div class="row"><input id="tBet" type="number" min="1" placeholder="Ставка" value="10"><input id="tLimit" type="number" min="0" placeholder="Мин. баланс для входа" value="100"></div><div class="row"><select id="tChat"><option value="open">Чат открыт</option><option value="closed">Чат закрыт</option></select><select id="tPlayers"><option>2</option><option>3</option><option>4</option><option>5</option><option>6</option><option selected>7</option></select></div><label><input id="tPrivate" type="checkbox" style="width:auto"> Приватный стол</label><input id="tPassword" placeholder="Пароль стола (если приватный)"><button id="createTable" class="btn gold">Создать стол</button><div id="adminTables"></div></div><div class="card"><h2>Пользователи</h2><input id="userSearch" placeholder="Поиск по логину, например Vasta31"><div id="userList"></div><div id="userDetails" class="hidden"></div></div></div><p class="notice">Текущая версия — функциональный прототип в браузере.</p></section></div><script>(function(){'use strict';const $=id=>document.getElementById(id),K='seka_proto_v3',SK='seka_session_v1';let db;try{db=JSON.parse(localStorage.getItem(K)||'{"users":{},"tables":[]}')}catch(e){db={users:{},tables:[]}}let session;try{session=JSON.parse(localStorage.getItem(SK)||'null')}catch(e){session=null}const save=()=>localStorage.setItem(K,JSON.stringify(db));const saveSession=()=>localStorage.setItem(SK,JSON.stringify(session));function show(id){['auth','lobby','admin'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function goHome(){if(!session){show('auth');return}$('who').textContent=session.user;$('adminPanelBtn').classList.toggle('hidden',!session.admin);if(session.admin){$('balance').textContent='ADMIN'}else{const x=db.users[session.user];if(!x){session=null;localStorage.removeItem(SK);show('auth');return}$('balance').textContent=x.balance}show('lobby');renderLobby()}$('brandHome').addEventListener('click',goHome);$('brandHome').addEventListener('touchend',e=>{e.preventDefault();goHome()},{passive:false});$('brandHome').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();goHome()}});$('adminHome').addEventListener('click',goHome);$('adminPanelBtn').addEventListener('click',()=>{if(session&&session.admin){show('admin');renderAdmin()}});$('loginTab').onclick=()=>{$('loginForm').classList.remove('hidden');$('regForm').classList.add('hidden');$('loginTab').classList.add('on');$('regTab').classList.remove('on')};$('regTab').onclick=()=>{$('regForm').classList.remove('hidden');$('loginForm').classList.add('hidden');$('regTab').classList.add('on');$('loginTab').classList.remove('on')};$('regBtn').onclick=()=>{const u=$('regUser').value.trim(),p=$('regPass').value,t=$('regTg').value.trim();if(u.length<3)return $('authMsg').textContent='Логин минимум 3 символа';if(p.length<6)return $('authMsg').textContent='Пароль минимум 6 символов';if(p!==$('regPass2').value)return $('authMsg').textContent='Пароли не совпадают';if(db.users[u])return $('authMsg').textContent='Такой логин уже существует';db.users[u]={password:p,telegram:t,balance:0,created:new Date().toLocaleString(),lastLogin:'—',lastLogout:'—',ip:'Будет доступен после подключения сервера'};save();$('authMsg').textContent='Аккаунт создан. Баланс: 0';$('loginTab').click();$('loginUser').value=u};$('loginBtn').onclick=()=>{const u=$('loginUser').value.trim(),p=$('loginPass').value;if(u==='Admin'&&p==='123123'){session={user:'Admin',admin:true};saveSession();goHome();return}const x=db.users[u];if(!x||x.password!==p)return $('authMsg').textContent='Неверный логин или пароль';x.lastLogin=new Date().toLocaleString();save();session={user:u,admin:false};saveSession();goHome()};function doLogout(){if(session&&!session.admin&&db.users[session.user]){db.users[session.user].lastLogout=new Date().toLocaleString();save()}session=null;localStorage.removeItem(SK);$('adminPanelBtn').classList.add('hidden');show('auth')}$('logout').onclick=doLogout;$('adminLogout').onclick=doLogout;function renderLobby(){$('tables').innerHTML=db.tables.length?db.tables.map((t,i)=>'<div class="tableCard"><b>'+esc(t.name)+'</b><p>Ставка: '+t.bet+' 🟠<br>Вход от: '+t.limit+' 🟠<br>Игроков: '+t.players+'<br>Чат: '+(t.chat==='open'?'открыт':'закрыт')+'<br>'+(t.private?'🔒 Приватный':'🌐 Открытый')+'</p><button class="btn gold" data-join="'+i+'">Войти</button></div>').join(''):'<p class="muted">Сейчас нет активных столов. Их создаёт администратор.</p>';$('tables').querySelectorAll('[data-join]').forEach(b=>b.onclick=()=>joinTable(+b.dataset.join))}function joinTable(i){const t=db.tables[i];if(!t||!session)return;if(!session.admin){const u=db.users[session.user];if(u.balance<t.limit)return alert('Недостаточно фишек для входа. Нужно минимум '+t.limit)}if(t.private){const p=prompt('Пароль стола');if(p!==t.password)return alert('Неверный пароль')}alert('Стол '+t.name+' готов для подключения к игровому движку.')}$('createTable').onclick=()=>{const name=$('tName').value.trim();if(!name)return;db.tables.push({name,bet:+$('tBet').value||1,limit:+$('tLimit').value||0,chat:$('tChat').value,players:+$('tPlayers').value,private:$('tPrivate').checked,password:$('tPrivate').checked?$('tPassword').value:''});save();renderAdmin()};function renderAdmin(){$('adminTables').innerHTML='<h3>Активные столы</h3>'+(db.tables.length?db.tables.map((t,i)=>'<div class="user"><span><b>'+esc(t.name)+'</b><br><small>'+t.bet+' 🟠 · '+t.players+' игроков · '+(t.private?'🔒':'🌐')+'</small></span><button class="btn danger" data-delete="'+i+'">Удалить</button></div>').join(''):'<span class="muted">Столов нет</span>');$('adminTables').querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{db.tables.splice(+b.dataset.delete,1);save();renderAdmin()});renderUsers($('userSearch').value)}$('userSearch').oninput=()=>renderUsers($('userSearch').value);function renderUsers(q=''){const a=Object.keys(db.users).filter(u=>u.toLowerCase().includes(q.toLowerCase()));$('userList').innerHTML=a.length?a.slice(0,100).map(u=>'<div class="user" data-user="'+encodeURIComponent(u)+'"><span><b>'+esc(u)+'</b><br><small>'+esc(db.users[u].telegram||'Telegram не указан')+'</small></span><span class="pill">'+db.users[u].balance+' 🟠</span></div>').join(''):'<p class="muted">Пользователь не найден</p>';$('userList').querySelectorAll('[data-user]').forEach(el=>el.onclick=()=>openUser(decodeURIComponent(el.dataset.user)))}function openUser(u){const x=db.users[u];$('userDetails').classList.remove('hidden');$('userDetails').innerHTML='<hr><h3>'+esc(u)+'</h3><p>Баланс: <b>'+x.balance+' 🟠</b><br>Telegram: '+esc(x.telegram||'—')+'<br>IP: '+esc(x.ip)+'<br>Последний вход: '+esc(x.lastLogin)+'<br>Последний выход: '+esc(x.lastLogout)+'</p><input id="chipAmount" type="number" min="1" placeholder="Количество фишек"><div class="row"><button id="giveChips" class="btn gold">Выдать</button><button id="takeChips" class="btn danger">Забрать</button></div>';$('giveChips').onclick=()=>chips(u,1);$('takeChips').onclick=()=>chips(u,-1)}function chips(u,s){const n=Math.floor(+$('chipAmount').value);if(!n||n<1)return;db.users[u].balance=Math.max(0,db.users[u].balance+s*n);save();openUser(u);renderUsers($('userSearch').value)}if(session)goHome();else show('auth')})();</script></body></html>
